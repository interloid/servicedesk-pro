<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password</title>
</head>

<body style="margin:0; padding:0; background:#f5f7fa; font-family:Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:40px 20px;">

        <table
          width="100%"
          cellpadding="0"
          cellspacing="0"
          border="0"
          style="max-width:500px; background:#ffffff; border-radius:8px; padding:40px;"
        >

          <tr>
            <td align="center">

              <h1 style="margin:0 0 20px; color:#111827; font-size:24px;">
                Reset your password
              </h1>

              <p style="margin:0 0 25px; color:#4b5563; font-size:15px; line-height:24px;">
                We received a request to reset your ServiceDesk Pro password.
                Click the button below to create a new password.
              </p>

              <a
                href="{{ .ConfirmationURL }}"
                style="
                  display:inline-block;
                  padding:12px 24px;
                  background:#0f766e;
                  color:#ffffff;
                  text-decoration:none;
                  border-radius:6px;
                  font-size:15px;
                  font-weight:bold;
                "
              >
                Reset Password
              </a>

              <p style="margin:25px 0 0; color:#6b7280; font-size:13px; line-height:20px;">
                If you didn't request a password reset, you can safely ignore
                this email.
              </p>

            </td>
          </tr>

          <tr>
            <td align="center" style="padding-top:30px; border-top:1px solid #e5e7eb;">

              <p style="margin:0; color:#9ca3af; font-size:12px;">
                © 2026 ServiceDesk Pro. All rights reserved.
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
